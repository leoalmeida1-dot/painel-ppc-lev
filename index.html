<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPC Lev — Painel de Gerentes Comerciais</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<aside>
  <div class="logo"><img id="logoImg" alt="Lev"><b>PPC Lev</b><span>Gerentes Comerciais</span></div>
  <nav>
    <button class="on" data-v="painel" onclick="go('painel')"><span class="ico">▦</span>Painel Geral</button>
    <button data-v="bonus" onclick="go('bonus')"><span class="ico">🏅</span>Acompanhamento de Bônus</button>
    <button data-v="dinamica" onclick="go('dinamica')"><span class="ico">⚡</span>Acompanhamento de Bônus c/ Hierarquia Dinâmica</button>
    <button data-v="gc" onclick="go('gc')"><span class="ico">🎯</span>Análise por GC</button>
  </nav>
  <div class="sync" id="syncBox">Sincronização:<br><b id="syncInfo">—</b></div>
</aside>
<nav class="mnav" id="mnav">
  <button class="on" data-v="painel" onclick="go('painel')"><span class="ico">▦</span><span class="tx">Painel</span></button>
  <button data-v="bonus" onclick="go('bonus')"><span class="ico">🏅</span><span class="tx">Bônus</span></button>
  <button data-v="dinamica" onclick="go('dinamica')"><span class="ico">⚡</span><span class="tx">Hierarquia</span></button>
  <button data-v="gc" onclick="go('gc')"><span class="ico">🎯</span><span class="tx">Por GC</span></button>
</nav>
<main>
  <header>
    <h1 id="vtitle"></h1>
    <div class="sub" id="vsub"></div>
    <button class="fbtn" id="fbtn" onclick="toggleFiltros()">
      <span>⚙︎</span><span>Filtros</span><span class="n" id="fcount">0</span>
    </button>
    <div class="hbar" id="filtros"></div>
  </header>
  <div class="content" id="view"></div>
  <footer id="foot"></footer>
</main>

<script src="data.js"></script>
<script src="app.js"></script>

</body>
</html>
